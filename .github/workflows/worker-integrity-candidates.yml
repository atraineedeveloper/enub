name: Worker integrity candidates

on:
  pull_request:
    branches:
      - main
    paths:
      - 'openspec/changes/worker-integrity-phase3/**'
      - '.github/workflows/worker-integrity-candidates.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
          github-token: ${{ github.token }}
      - name: Generate standalone migration candidates
        run: |
          set -euo pipefail
          supabase migration new --help
          supabase migration new repair_worker_identity_sequences
          repair=$(find supabase/migrations -name '*_repair_worker_identity_sequences.sql')
          cp openspec/changes/worker-integrity-phase3/sequence-repair.sql "$repair"
          sleep 2
          supabase migration new create_worker_atomically
          atomic=$(find supabase/migrations -name '*_create_worker_atomically.sql')
          cp openspec/changes/worker-integrity-phase3/atomic-create.sql "$atomic"
          printf 'Generated migration: %s\n' "$repair" "$atomic"
          cp openspec/changes/worker-integrity-phase3/atomic-create.test.sql supabase/tests/database/atomic-create.test.sql
      - name: Start isolated database with candidate migrations
        run: supabase db start
      - name: Lint candidate schemas
        run: supabase db lint --local --schema public,private --fail-on error
      - name: Run all local database tests
        run: supabase test db --local
      - name: Export generated candidate migrations
        uses: actions/upload-artifact@v4
        with:
          name: worker-integrity-migrations
          path: |
            supabase/migrations/*_repair_worker_identity_sequences.sql
            supabase/migrations/*_create_worker_atomically.sql
