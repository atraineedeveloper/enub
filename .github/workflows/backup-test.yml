name: Backup synthetic verification
on:
  pull_request:
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/*backup*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - run: bash -n scripts/backup/*.sh
      - run: node --check scripts/backup/storage.mjs
      - run: bash scripts/backup/test-package.sh
