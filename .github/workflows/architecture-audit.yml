name: Architecture baseline
on:
  pull_request:
    branches: [fix/dependency-security]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - run: bun install --frozen-lockfile
      - run: bun run scripts/audit-architecture.ts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
