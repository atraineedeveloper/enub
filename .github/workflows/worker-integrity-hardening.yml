name: Worker integrity hardening
on:
  pull_request:
    branches: [main]
    paths:
      - 'openspec/changes/worker-integrity-phase3/**'
      - 'supabase/migrations/**'
      - '.github/workflows/worker-integrity-hardening.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
          github-token: ${{ github.token }}
      - name: Generate hardening migration
        run: |
          supabase migration new harden_worker_relations_and_photo_access
          migration=$(find supabase/migrations -name '*_harden_worker_relations_and_photo_access.sql')
          cp openspec/changes/worker-integrity-phase3/relation-validation-and-photo-rls.sql "$migration"
          cp openspec/changes/worker-integrity-phase3/relation-validation.test.sql supabase/tests/database/worker_relation_validation.test.sql
          printf 'Generated migration: %s\n' "$migration"
      - run: supabase db start
      - run: supabase db lint --local --schema public,private --fail-on error
      - run: supabase test db --local
      - uses: actions/upload-artifact@v4
        with:
          name: worker-integrity-hardening-migration
          path: supabase/migrations/*_harden_worker_relations_and_photo_access.sql
