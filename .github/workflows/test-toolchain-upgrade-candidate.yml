name: Test and lint toolchain upgrade candidate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-toolchain-upgrade-candidate.yml'
      - 'scripts/prepare-test-toolchain-candidate.mjs'
permissions:
  contents: read
jobs:
  candidate:
    if: github.head_ref == 'fix/dependency-security'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - run: node scripts/prepare-test-toolchain-candidate.mjs
      - run: bun install --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Emit generated lockfile
        run: |
          git hash-object bun.lock
          echo BEGIN_GENERATED_LOCKFILE
          base64 -w 76 bun.lock
          echo END_GENERATED_LOCKFILE
      - name: Capture candidate patch
        run: git diff --binary -- package.json bun.lock > test-toolchain.patch
      - uses: actions/upload-artifact@v4
        with:
          name: test-toolchain-candidate
          path: test-toolchain.patch
      - name: Audit candidate
        continue-on-error: true
        run: bun audit
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
