name: PDF dependency upgrade candidate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pdf-upgrade-candidate.yml'
      - 'scripts/prepare-pdf-upgrade-candidate.mjs'
permissions:
  contents: read
jobs:
  candidate:
    if: github.head_ref == 'fix/dependency-security'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Prepare reviewed PDF migration in temporary checkout
        run: node scripts/prepare-pdf-upgrade-candidate.mjs
      - name: Generate candidate lockfile using Bun
        run: bun install --ignore-scripts
      - name: Verify reproducibility
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Capture candidate patch
        run: git diff --binary -- package.json bun.lock src/pdf > pdf-upgrade.patch
      - name: Emit generated lockfile for reviewed commit handoff
        run: |
          git hash-object bun.lock
          echo 'BEGIN_GENERATED_LOCKFILE'
          base64 -w 76 bun.lock
          echo 'END_GENERATED_LOCKFILE'
      - name: Upload candidate patch
        uses: actions/upload-artifact@v4
        with:
          name: pdf-upgrade-candidate
          path: pdf-upgrade.patch
      - name: Audit candidate
        continue-on-error: true
        run: bun audit
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
