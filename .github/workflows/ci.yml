name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Architecture inventory
        run: bun run scripts/audit-architecture.ts

      - name: Performance audit
        run: bun run scripts/audit-build.ts

  dependency-audit:
    name: Dependency security audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Audit locked dependencies
        continue-on-error: true
        run: bun audit

  supabase:
    name: Supabase migrations, lint, and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
          github-token: ${{ github.token }}

      - name: Start fresh local database
        run: supabase db start

      - name: Verify Postgres 17
        env:
          PGPASSWORD: postgres
        run: |
          server_version="$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atqc 'show server_version')"
          echo "Local Supabase Postgres: ${server_version}"
          [[ "${server_version}" == 17.* ]]

      - name: Lint application database schemas
        run: supabase db lint --local --schema public,private,group_admin_private --fail-on error

      - name: Run pgTAP database tests
        run: supabase test db --local

      - name: Verify promoted migration integrity
        run: |
          echo "ddde6e3498237cfc792f6147a0a0fa668eb6114526064d7b8c412d28f1b260f6  supabase/migrations/20261126201604_group_lifecycle_management.sql" | sha256sum -c -
      - name: Run group lifecycle concurrent transactions
        run: bash openspec/changes/group-lifecycle-management/concurrency-candidate.sh
      - name: Rehearse synthetic audit backup and restore
        run: bash openspec/changes/group-lifecycle-management/restore-rehearsal.sh
      - name: Generate local schema types for review
        run: |
          mkdir -p /tmp/group-schema-output
          supabase gen types typescript --local --schema public,graphql_public > /tmp/group-schema-output/supabase.ts
      - name: Publish generated schema types
        uses: actions/upload-artifact@v4
        with:
          name: group-lifecycle-schema-types
          path: /tmp/group-schema-output/supabase.ts
          retention-days: 7
          if-no-files-found: error
