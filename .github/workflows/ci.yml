name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  supabase:
    name: Supabase migrations, lint, and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
          github-token: ${{ github.token }}

      - name: Start fresh local database
        run: supabase db start

      - name: Verify Postgres 17
        env:
          PGPASSWORD: postgres
        run: |
          server_version="$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atqc 'show server_version')"
          echo "Local Supabase Postgres: ${server_version}"
          [[ "${server_version}" == 17.* ]]

      - name: Lint application database schemas
        run: supabase db lint --local --schema public,private --fail-on error

      - name: Run pgTAP database tests
        run: supabase test db --local
