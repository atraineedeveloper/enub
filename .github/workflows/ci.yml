name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Architecture inventory
        run: bun run scripts/audit-architecture.ts

      - name: Performance audit
        run: bun run scripts/audit-build.ts

  dependency-audit:
    name: Dependency security audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Audit locked dependencies
        continue-on-error: true
        run: bun audit

  supabase:
    name: Supabase migrations, lint, and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
          github-token: ${{ github.token }}

      - name: Start fresh local database
        run: supabase db start

      - name: Verify Postgres 17
        env:
          PGPASSWORD: postgres
        run: |
          server_version="$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atqc 'show server_version')"
          echo "Local Supabase Postgres: ${server_version}"
          [[ "${server_version}" == 17.* ]]

      - name: Lint application database schemas
        run: supabase db lint --local --schema public,private --fail-on error

      - name: Run pgTAP database tests
        run: supabase test db --local

      # Candidate validation only, on the disposable runner database.
      - name: Validate group lifecycle candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/group-lifecycle-management'
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          candidate=openspec/changes/group-lifecycle-management
          psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 --single-transaction -f "$candidate/schema-candidate.sql" -f "$candidate/lifecycle-candidate.sql"
          supabase db lint --local --schema public,group_admin_private --fail-on error
          cp "$candidate/lifecycle-candidate.test.sql" supabase/tests/database/group-lifecycle-candidate.test.sql
          # Run candidate-specific tests only; legacy grant expectations and seed
          # behavior must be reconciled before promoting the migration.
          supabase test db supabase/tests/database/group-lifecycle-candidate.test.sql --local
          bash "$candidate/concurrency-candidate.sh"

      - name: Generate migration candidate with Supabase CLI
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/group-lifecycle-management'
        run: |
          set -euo pipefail
          candidate=openspec/changes/group-lifecycle-management
          supabase migration new group_lifecycle_management
          shopt -s nullglob
          files=(supabase/migrations/*_group_lifecycle_management.sql)
          [[ ${#files[@]} == 1 ]]
          cat "$candidate/schema-candidate.sql" "$candidate/lifecycle-candidate.sql" > "${files[0]}"
          mkdir -p /tmp/group-migration-output
          cp "${files[0]}" /tmp/group-migration-output/
          basename "${files[0]}"
          sha256sum "${files[0]}"
      - name: Publish generated migration candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/group-lifecycle-management'
        uses: actions/upload-artifact@v4
        with:
          name: group-lifecycle-migration
          path: /tmp/group-migration-output/*.sql
          retention-days: 7
          if-no-files-found: error
